name: marker-hub

services:
  api:
    image: ${BLOG_API_IMAGE:-marker-hub-api:local}
    build:
      context: ..
    env_file:
      - path: .env.runtime
        required: false
    environment:
      BLOG_ALLOWED_ORIGINS: ${BLOG_ALLOWED_ORIGINS:?Set BLOG_ALLOWED_ORIGINS in deploy/.env}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPRING_DATASOURCE_DRUID_MAXWAIT: "3000"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${BLOG_WEB_IMAGE:-marker-hub-web:local}
    build:
      context: ${BLOG_WEB_CONTEXT:-../../marker-hub-blog-vue}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BLOG_BIND_IP:-127.0.0.1}:${BLOG_HTTP_PORT:-18080}:8080"
    restart: unless-stopped
    mem_limit: 128m
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
